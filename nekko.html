<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - ねっこ (떼창 가이드)</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .main-container {
      width: 100%;
      max-width: 560px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      background-color: #000;
      border-bottom: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .lyrics-wrapper {
      width: 100%;
      height: 52vh;
      min-height: 280px;
      padding: 24px 16px;
      box-sizing: border-box;
      overflow-y: auto;
      
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );

      scrollbar-width: thin;
      scrollbar-color: #2e2e3a transparent;
    }

    .lyrics-wrapper::-webkit-scrollbar {
      width: 4px;
    }

    .lyrics-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .lyrics-wrapper::-webkit-scrollbar-thumb {
      background-color: #2e2e3a;
      border-radius: 4px;
    }

    .lyric-line {
      padding: 12px 14px;
      margin: 6px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--text-muted);
      transition: all 0.22s ease-out;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #7b7b8a;
      font-weight: 400;
      display: block;
      margin-top: 4px;
      transition: color 0.2s;
    }

    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
      transform: scale(1.01);
    }

    .lyric-line.active .sub-lyric {
      color: #b5b5c2;
    }

    /* 전체 줄 떼창 적용시 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 14px rgba(255, 71, 87, 0.65);
      background-color: rgba(255, 71, 87, 0.1);
    }

    /* 부분 떼창 (inline-chant) 스타일 */
    .inline-chant {
      color: #ff6b81;
      transition: all 0.2s ease;
    }

    .lyric-line.active .inline-chant {
      color: #ff4757;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">ねっこ (넷코)</div>
    <div style="width: 38px;"></div>
  </div>

    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <div class="lyrics-wrapper" id="lyricsContainer"></div>
  </div>

      { time: 136.5, text: "誰にも見えやしないけれど<br><span class='sub-lyric'>다레니모 미에야시나이케레도<br>누구에게도 보이지 않지만</span>", isChant: true },

      { time: 151.0, text: "<span class='inline-chant'>心ふたつ悲しみひとつで</span><br><span class='sub-lyric'><span class='inline-chant'>코코로 후타츠 카나시미 히토츠데</span><br><span class='inline-chant'>두 개의 마음 하나의 슬픔으로</span></span>", isChant: false },
      { time: 156.0, text: "<span class='inline-chant'>何十年先も咲き続ける花</span><br><span class='sub-lyric'><span class='inline-chant'>난쥬넨 사키모 사키츠즈케루 하나</span><br><span class='inline-chant'>몇십 년 뒤에도 계속 피어날 꽃</span></span>", isChant: false },
      { time: 161.0, text: "<span class='inline-chant'>無常の上に</span> さあ咲き誇れ<br><span class='sub-lyric'><span class='inline-chant'>무죠노 우에니</span> 사아 사키호코레<br><span class='inline-chant'>덧없는 세상에도</span> 자 피어봐</span>", isChant: false },
      
      { time: 168.0, text: "ささやかな花でいい<br><span class='sub-lyric'>사사야카나 하나데 이이<br>작은 꽃이면 돼</span>", isChant: false },
      { time: 171.8, text: "大袈裟でなくていい<br><span class='sub-lyric'>오오게사데 나쿠테 이이<br>거창할 필요 없어</span>", isChant: false },
      { time: 175.5, text: "ただあなたと 幾度もの嵐を迎えようと<br><span class='sub-lyric'>타다 아나타토 이쿠도모노 아라시오 무카에요오토<br>당신과 몇 번의 폭풍을 맞더라도</span>", isChant: false },
      { time: 182.5, text: "決して折れはしない<br><span class='sub-lyric'>케시테 오레와 시나이<br>절대 꺾이지 않아</span>", isChant: false },
      { time: 186.5, text: "そんな花がいい<br><span class='sub-lyric'>손나 하나가 이이<br>그런 꽃이면 돼</span>", isChant: false },
      
      { time: 191.0, text: "ささやかな花でいい<br><span class='sub-lyric'>사사야카나 하나데 이이<br>작은 꽃이면 돼</span>", isChant: false },
      { time: 195.0, text: "大袈裟でなくていい<br><span class='sub-lyric'>오오게사데 나쿠테 이이<br>거창할 필요 없어</span>", isChant: false },
      { time: 198.8, text: "ただあなたにとって 価値があればいい<br><span class='sub-lyric'>타다 아나타니 톳테 카치가 아레바 이이<br>그저 당신에게 있어서 가치가 있다면 돼</span>", isChant: false },

      { time: 209.8, text: "有り触れた一輪でいい<br><span class='sub-lyric'>아리후레타 이치린데 이이<br>어디에나 있는 한 송이면 돼</span>", isChant: false },
      { time: 213.8, text: "あなたが項垂れた その先に根を張る<br><span class='sub-lyric'>아나타가 우나다레타 소노 사키니 네오 하루<br>당신이 고개를 떨군 그 발밑에 뿌리를 내릴게</span>", isChant: false },

      { time: 224.8, text: "華やかでなくていい<br><span class='sub-lyric'>하나야카데 나쿠테 이이<br>화려하지 않아도 돼</span>", isChant: false },
      { time: 228.8, text: "あなたの痛みの上に 根を張れればいい<br><span class='sub-lyric'>아나타노 이타미노 우에니 네오 하레레바 이이<br>당신이 가진 상처 위에 뿌리를 내릴 수 있으면 돼</span>", isChant: false },
      
      { time: 235.8, text: "一頻りの雨に 流されぬような<br><span class='sub-lyric'>히토시키리노 아메니 나가사레누 요오나<br>한바탕 내리는 비에도 흘러가지 않는</span>", isChant: false },
      { time: 243.0, text: "ふとした悲しみを そっと忘れさせるような<br><span class='sub-lyric'>후토시타 카나시미오 솟토 와스레사세루 요오나<br>사소한 슬픔을 살며시 잊게 해주는</span>", isChant: false },
      { time: 247.5, text: "そんな花でいい<br><span class='sub-lyric'>손나 하나데 이이<br>그런 꽃이면 돼</span>", isChant: false }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
