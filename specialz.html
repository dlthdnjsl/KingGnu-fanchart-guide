<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - SPECIALZ (떼창 가이드)</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 (모바일 대응 높이 최적화) */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px; /* 모바일에서 영상 크기를 적절히 줄임 */
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 (높이 확장) */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh; /* 화면 높이의 절반 이상을 가사 영역으로 활용 */
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* 현재 재생 중인 가사 하이라이트 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 떼창 파트 스타일 */
    .lyric-line.chant {
      color: #ff6b81;
    }

    .lyric-line.active.chant {
      color: var(--chant-color);
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }

  /* 발음 및 해석 가사 크기 축소 (수정본) */
.sub-lyric {
  font-size: 0.8rem !important; /* 글자 크기를 확실하게 작게 고정 */
  color: #a0a0ab !important;    /* 부모 색상에 안 묻히게 살짝 어두운 색상 */
  font-weight: normal !important; /* 하이라이트 되어도 굵어지지 않게 설정 */
  display: block;
  margin-top: 3px;
}
  </style>
</head>
<body>

  <!-- 상단 뒤로가기 및 제목 -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 목록으로</a>
    <div class="page-title">SPECIALZ</div>
    <div style="width: 70px;"></div> <!-- 정렬용 여백 -->
  </div>

  <!-- 유튜브 동영상 영역 -->
  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <!-- 가사 스크롤 영역 -->
  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    // ========================================================
    // 1. [여기 수정] 유튜브 영상 ID (watch?v= 뒤의 문자열)
    // ========================================================
    const YOUTUBE_VIDEO_ID = '5MZo9otAWAw'; 


    // ========================================================
    // 2. [여기 수정] 가사 및 타임코드 데이터 (초 단위 시간, 가사, 떼창여부)
    // ========================================================
    const lyricsData = [
    const lyricsData = [
  { time: 0, text: "🎵 (박자에 맞춰서 박수)", isChant: false },
  { time: 14.0, text: "U R MY SPECIAL", isChant: true },
  { time: 22.5, text: "U R MY SPECIAL", isChant: true },
  { time: 24.5, text: "今際の際際で踊りましょう<br><span class='sub-lyric'>이마와노 키와기와데 오도리마쇼<br>죽음 앞에서 춤을 춰봅시다</span>", isChant: false },
  { time: 29.0, text: "東京前線興の都<br><span class='sub-lyric'>토쿄 젠센 쿄노 미야코<br>도쿄 전선 흥의 도시</span>", isChant: true },
  { time: 33.0, text: "往生際の際際で足掻きましょう<br><span class='sub-lyric'>오죠기와노 키와기와데 아가키마쇼<br>죽음 앞에서 발버둥쳐봅시다</span>", isChant: false },
  { time: 37.0, text: "お行儀の悪い面も見せてよ<br><span class='sub-lyric'>오교기노 와루이 츠라모 미세테요<br>예의 없는 모습도 보여줘</span>", isChant: true },
  { time: 42.0, text: "i luv u baby", isChant: true },
  { time: 44.0, text: "謳い続けましょう<br><span class='sub-lyric'>우타이 츠즈케마쇼<br>계속 노래를 부릅시다</span>", isChant: false },
  { time: 45.8, text: "如何痴れ者も 如何余所者も<br><span class='sub-lyric'>돈나 시레모노모 돈나 요소모노모<br>바보도 이방인도 함께</span>", isChant: false },
  { time: 50.3, text: "心燃える一挙手一投足<br><span class='sub-lyric'>코코로 모에루 잇쿄슈잇토소쿠<br>마음을 태우는 일거수일투족</span>", isChant: false },
  { time: 54.0, text: "走り出したらアンコントロール<br><span class='sub-lyric'>하시리 다시타라 안콘토루<br>달리기 시작하면 아무도 말리지 못해</span>", isChant: false },
  { time: 55.5, text: "U R MY SPECIAL", isChant: true }
    ];


    // --- 아래는 기본 자동 싱크 로직 (수정할 필요 없음) ---
    let player;
    let timerInterval = null;
    let currentIndex = -1;

    // 가사 HTML 요소 생성
    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    // YouTube Iframe API 로드
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
