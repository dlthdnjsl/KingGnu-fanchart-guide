<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - 떼창 싱크 가이드</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-muted: #777777;
      --text-active: #ffffff;
      --chant-color: #ff4757;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { font-size: 1.4rem; margin-bottom: 20px; }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
    }

    #player { width: 100%; height: 100%; }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 320px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 1.05rem;
      color: var(--text-muted);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    /* 현재 재생 중인 가사 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: bold;
      font-size: 1.2rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 떼창 파트 스타일 */
    .lyric-line.chant { color: #ff6b81; }
    .lyric-line.active.chant {
      color: var(--chant-color);
      text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
    }
  </style>
</head>
<body>

  <h1>King Gnu - SPECIALZ (떼창 가이드)</h1>

  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    // 1. 가사 및 싱크 데이터 (초 단위 시간, 가사, 떼창 여부)
    const lyricsData = [
      { time: 0, text: "🎵 (반주 구간)", isChant: false },
      { time: 10.5, text: "You are my special", isChant: false },
      { time: 13.0, text: "今際の際で踊りましょ (마지막 순간에 춤춥시다)", isChant: true },
      { time: 18.2, text: "東京前線狂乱騒ぎ (도쿄 전선 광란의 소동)", isChant: false },
      { time: 22.0, text: "Get crazy for me!!", isChant: true },
      { time: 25.5, text: "今宵、宴の華を添えましょう (오늘 밤 연회의 꽃을 더해봅시다)", isChant: false }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    // 2. 가사 HTML 요소를 화면에 생성
    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerText = item.text;
      div.id = `lyric-${index}`;
      
      // 가사를 클릭하면 해당 시간대로 영상 이동하는 편의 기능
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    // 3. YouTube Iframe API 불러오기
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    // API 로드 완료 시 플레이어 생성
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: '5MZo9otAWAw', // 사용하실 유튜브 영상 ID
        playerVars: { 'rel': 0, 'modestbranding': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    // 4. 영상 재생 상태 변화 감지
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        // 영상 재생 중일 때 0.1초마다 재생 시간 체크
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        // 일시정지나 영상 종료 시 감지 중단
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // 5. 현재 재생 시간에 맞춰 가사 하이라이트 및 스크롤 처리
    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      
      const currentTime = player.getCurrentTime();

      // 현재 재생 구간에 맞는 가사 인덱스 찾기
      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      // 구간이 변경되었을 때만 화면 갱신
      if (activeIndex !== currentIndex) {
        // 이전 하이라이트 해제
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        // 새 가사 하이라이트 및 스크롤 이동
        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
