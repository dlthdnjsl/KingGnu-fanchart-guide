      align-items: center;

      letter-spacing: -0.3px;

    }

        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%

   /* 가사 기본 스타일: 평소에는 배경 없이 은은하게 */
    .lyric-line {

      background: transparent !important;
      transition: color 0.3s;

    .lyric-line.active {

      { time: 257.5, text: "今夜この羽根で飛びたくて<br><span class='sub-lyric'>콘야 코노 하네데 토비타쿠테<br>오늘 밤 이 날개로 날고 싶어서</span>", isChant: false },
      { time: 260.7, text: "この大空を飛びたくて<br><span class='sub-lyric'>코노 오오조라오 토비타쿠테<br>이 넓은 하늘을 날고 싶어서</span>", isChant: false },
      { time: 263.3, text: "命生まれ 命生まれ<br><span class='sub-lyric'>이노치 우마레 이노치 우마레<br>생명이 태어나 생명이 태어나</span>", isChant: false },

      { time: 266.9, text: "この風に飛び乗って<br><span class='sub-lyric'>코노 카제니 토비놋테<br>이 바람에 올라타서</span>", isChant: false },
      { time: 269.1, text: "今夜名も無き風となって<br><span class='sub-lyric'>콘야 나모나키 카제토 낫테<br>오늘 밤 이름도 없는 바람이 되어</span>", isChant: false },
      { time: 272.4, text: "清濁を併せ呑んで<br><span class='sub-lyric'>세이다쿠오 아와세 논데<br>선악 가리지 말고 모두 받아들여</span>", isChant: false },
      { time: 274.9, text: "命揺らせ 命揺らせ<br><span class='sub-lyric'>이노치 유라세 이노치 유라세<br>목숨을 흔들어 목숨을 흔들어</span>", isChant: false },
      { time: 280.0, text: "🔥🎵", isChant: false },  
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            
            // 변경된 부분: scrollIntoView 대신 scrollTop을 직접 제어하여 화면 전체가 내려가는 현상 방지
            const scrollPos = currentEl.offsetTop - (container.clientHeight / 2) + (currentEl.clientHeight / 2);
            
            container.scrollTo({
              top: scrollPos,
              behavior: 'smooth'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
