<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - STARDOM</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & '←' 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    /* 일반 가사 재생 중 강조 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 떼창 가사 기본 상태 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 떼창 가사 재생 중 강조 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->

  { time: 108.5, text: "🎵", isChant: false },
  { time: 123.0, text: "心の底で諦めかけていた<br><span class='sub-lyric'>코코로노 소코데 아키라메 카케테이타<br>마음 깊은 곳에서 거의 포기하고 있던</span>", isChant: false },
  { time: 127.5, text: "夢を嗤わないでくれた<br><span class='sub-lyric'>유메오 와라와나이데 쿠레타<br>꿈을 비웃지 않은</span>", isChant: false },
  { time: 131.7, text: "あなたに今応えたいんだ<br><span class='sub-lyric'>아나타니 이마 코타에타인다<br>당신에게 이제 보답하고 싶어</span>", isChant: false },

  { time: 142.0, text: "さあ命揺らせよ blow life<br><span class='sub-lyric'>사아 이노치 유라세요 blow life<br>자 목숨을 흔들어봐 blow life</span>", isChant: false },
  { time: 143.8, text: "One life 諦めない限り続く<br><span class='sub-lyric'>One life 아키라메나이 카키리 츠즈쿠<br>한 번 뿐인 인생 포기하지 않는 한 계속 되는</span>", isChant: false },
  { time: 146.3, text: "endless party", isChant: true },
  { time: 147.0, text: "勝利の女神よ気分はどうだい?<br><span class='sub-lyric'>쇼리노 메가미요 키분와 도다이<br>승리의 여신이여 기분은 어때?</span>", isChant: false },
  { time: 149.4, text: "そろそろこっちを向いて頂戴！<br><span class='sub-lyric'>소로소로 콧치오 무이테 쵸다이<br>슬슬 이쪽을 봐줘!</span>", isChant: false },

  { time: 158.0, text: "あと一歩<br><span class='sub-lyric'>아토 잇포<br>한 걸음 더</span>", isChant: true },
  { time: 159.5, text: "ここからあと一歩<br><span class='sub-lyric'>코코카라 아토 잇포<br>여기서부터 한 걸음 더</span>", isChant: true },
  { time: 161.5, text: "怖いモノ知って尚<br><span class='sub-lyric'>코와이모노 싯테 나오<br>무서운 걸 알고서도</span>", isChant: false },
  { time: 163.5, text: "立ち向かってゆけ<br><span class='sub-lyric'>타치무캇테 유케<br>맞서싸워나가</span>", isChant: false },
  { time: 166.0, text: "あの日の<br><span class='sub-lyric'>아노 히노<br>그 날의</span>", isChant: false },

  { time: 170.2, text: "この胸に強く<br><span class='sub-lyric'>코노 무네니 츠요쿠<br>이 가슴에 강하게 생기는</span>", isChant: false },
  { time: 172.0, text: "一つの未来を信じ抜いて<br><span class='sub-lyric'>히토츠노 미라이오 신지누이테<br>단 하나의 미래를 믿어</span>", isChant: false },
  { time: 174.5, text: "あと一歩<br><span class='sub-lyric'>아토 잇포<br>한 걸음 더</span>", isChant: false },
  { time: 175.7, text: "ここからあと一歩<br><span class='sub-lyric'>코코카라 아토 잇포<br>여기서부터 한 걸음 더</span>", isChant: false },
  { time: 178.2, text: "ココロが草臥れた足を走らせる<br><span class='sub-lyric'>코코로가 쿠타비레타 아시오 하시라세루<br>마음이 지쳐버린 다리를 움직이게 해</span>", isChant: false },

  { time: 191.6, text: "続けるから<br><span class='sub-lyric'>츠즈케루카라<br>계속할 테니까</span>", isChant: false },
  { time: 193.0, text: "(Oh)", isChant: true },

  { time: 222.0, text: "(Oh) hey hey", isChant: true },
  { time: 226.2, text: "生に涯があったって<br><span class='sub-lyric'>세이니 하테가 앗탓테<br>인생은 끝이 있다고 해도</span>", isChant: false },
  { time: 228.2, text: "名前に涯など無いね<br><span class='sub-lyric'>나마에니 하테나도 나이네<br>이름에 끝이란 건 없어</span>", isChant: false },
  { time: 230.3, text: "栄光の輝きに毒されて<br><span class='sub-lyric'>에이코노 카가야키니 도쿠사레테<br>영광의 반짝임에 취해</span>", isChant: false },
  { time: 232.7, text: "限界の少し先へ<br><span class='sub-lyric'>겐카이노 스코시 사키에<br>한계 너머로</span>", isChant: false },

  { time: 238.7, text: "人事を尽くし切って今<br><span class='sub-lyric'>진지오 츠쿠시킷타 이마<br>할 일을 다 한 지금</span>", isChant: false },
  { time: 240.7, text: "天命を待つだけだって<br><span class='sub-lyric'>텐메이오 마츠다케닷테<br>하늘의 뜻을 기다릴 뿐이야</span>", isChant: false }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>

</html>
