<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - Vinyl</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    /* 일반 가사 재생 중 강조 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 떼창 가사 기본 상태 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 떼창 가사 재생 중 강조 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">Vinyl</div>
    <div style="width: 38px;"></div>
  </div>

  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    const YOUTUBE_VIDEO_ID = 'RLAw8Ct9k48'; 

    const lyricsData = [
      { time: 4.5, text: "🎵", isChant: false },
      { time: 39.0, text: "貫いて、この心を、思い切り突き刺して<br><span class='sub-lyric'>츠라누이테 코노 코코로오 오모이키리 츠키사시테<br>꿰뚫어줘 이 마음을 마음껏 찔러줘</span>", isChant: false },
      { time: 46.1, text: "火照ったままで、知らぬふりはもうやめて<br><span class='sub-lyric'>호텟타 마마데 시라누 후리와 모오 야메테<br>달아오른 채로 모른 척하는 건 이제 그만둬</span>", isChant: false },
      
      { time: 51.4, text: "暇つぶしには飽きたのよ<br><span class='sub-lyric'>히마츠부시니와 아키타노요<br>시간 때우는 건 질렸어</span>", isChant: false },
      { time: 54.3, text: "纏ったビニールを脱がせたいの<br><span class='sub-lyric'>마톳타 비니루오 누가세타이노<br>달라붙은 비닐을 벗기고 싶어</span>", isChant: false },
      { time: 58.3, text: "お前の思惑から無邪気に抜け出して<br><span class='sub-lyric'>오마에노 오모와쿠카라 무쟈키니 누케다시테<br>너의 의도로부터 순진하게 빠져나와</span>", isChant: false },

      { time: 63.8, text: "“さよなら、愛を込めて”<br><span class='sub-lyric'>사요나라 아이오 코메테<br>사랑을 담아, 안녕</span>", isChant: true },

      { time: 68.4, text: "気の済むまで暴れなよ<br><span class='sub-lyric'>키노스무마데 아바레나요<br>기분이 풀릴 때까지 날뛰어봐</span>", isChant: false },
      { time: 70.8, text: "哀れだろ？むしゃくしゃするぜ<br><span class='sub-lyric'>아와레다로 무샤쿠샤스루제<br>불쌍하지? 짜증이 나</span>", isChant: false },
      { time: 73.8, text: "喧騒に上がる煙に飛び込んでいくだけさ<br><span class='sub-lyric'>켄소니 아가루 케무리니 토비콘데 이쿠다케사<br>소란스럽게 피어오르는 연기에 뛰어들 뿐이야</span>", isChant: false },
      
      { time: 79.0, text: "「遊びがないの、あなたには」<br><span class='sub-lyric'>아소비가 나이노 아나타니와<br>너는 노는 맛이 없어</span>", isChant: false },
      { time: 81.5, text: "なんて適当に言葉侍らせて<br><span class='sub-lyric'>난테 테키토니 코토바 하베라세테<br>라는 적당한 말과 함께</span>", isChant: false },
      { time: 84.6, text: "喧騒に上がる煙に薪をくべろ<br><span class='sub-lyric'>켄소니 아가루 케무리니 마키오 쿠베로<br>소란스럽게 피어오르는 연기에 장작을 지펴</span>", isChant: false },
      { time: 92.0, text: "🎵", isChant: false },
      { time: 105.0, text: "今日も軽やかなステップで<br><span class='sub-lyric'>쿄모 카로야카나 스텝푸데<br>오늘도 경쾌한 발거음으로</span>", isChant: false },
      { time: 107.6, text: "騙し騙し生きて行こうじゃないか<br><span class='sub-lyric'>다마시다마시 이키테 이코오쟈나이카<br>조심조심 살아가볼래</span>", isChant: false },
      { time: 112.1, text: "真っ暗な明日を欺いてさ<br><span class='sub-lyric'>맛쿠로나 아스오 아자무이테사<br>새까만 내일을 속여서 말이야</span>", isChant: false },

      { time: 116.1, text: "誰に向けたナイフなの？<br><span class='sub-lyric'>다레니 무케타 나이후나노<br>누구에게 겨눈 칼이야?</span>", isChant: false },
      { time: 119.2, text: "何に突き動かされてる？<br><span class='sub-lyric'>나니니 츠키우고카사레테루<br>뭐에 마음이 움직이고 있어?</span>", isChant: false },
      { time: 124.0, text: "苦しいだけの“現実”はもう止めて<br><span class='sub-lyric'>쿠루시이 다케노 겐지츠와 모오 야메테<br>괴로울뿐인 현실은 이제 그만</span>", isChant: false },

      { time: 128.8, text: "“さよなら、愛を込めて”<br><span class='sub-lyric'>사요나라 아이오 코메테<br>마음을 담아, 안녕</span>", isChant: true },

      { time: 133.0, text: "息を吸いなよ<br><span class='sub-lyric'>이키오 스이나요<br>숨을 쉬어봐</span>", isChant: false },
      { time: 135.0, text: "この街の、有り余るほどの空気を<br><span class='sub-lyric'>코노 마치노 아리아마루 호도노 쿠키오<br>이 거리의 남아도는 공기를</span>", isChant: false },
      { time: 139.0, text: "焦れったいビニールの中から<br><span class='sub-lyric'>지렛타이 비니루노 나카카라<br>답답한 비닐에서</span>", isChant: false },
      { time: 141.7, text: "ストリートへ抜け出たなら<br><span class='sub-lyric'>스토리토에 누케데타나라<br>거리로 빠져나왔다면</span>", isChant: false },
      
      { time: 144.3, text: "遊びきるんだ、この世界<br><span class='sub-lyric'>아소비키룬다 코노세카이<br>이 세상을 마음껏 즐겨보는 거야</span>", isChant: false },
      { time: 146.5, text: "喧騒、狂乱に、雨あられ<br><span class='sub-lyric'>켄소 쿄란니 아메아라레<br>소란과 광란에 흠뻑 젖어</span>", isChant: false },
      { time: 149.8, text: "掻っ攫ったもん勝ちでしょ？<br><span class='sub-lyric'>캇사랏타몬 가치데쇼<br>먼저 낚아채는 사람이 이기는 거잖아?</span>", isChant: false },

      { time: 156.5, text: "さよなら 愛を込めて<br><span class='sub-lyric'>사요나라 아이오 코메테<br>사랑을 담아 안녕</span>", isChant: true },
      { time: 159.2, text: "思いの丈を着飾って<br><span class='sub-lyric'>오모이노 타케오 키카잣테<br>속마음을 꾸며내고</span>", isChant: true },
      { time: 161.8, text: "どんちゃん騒ぎのナイトクラブから<br><span class='sub-lyric'>돈챤 사와기노 나이토크라부카라<br>시끄러운 나이트클럽에서</span>", isChant: true },
      
      { time: 167.0, text: "さよなら 愛を込めて<br><span class='sub-lyric'>사요나라 아이오 코메테<br>사랑을 담아 안녕</span>", isChant: true },
      { time: 169.8, text: "思いの丈を着飾って<br><span class='sub-lyric'>오모이노 타케오 키카잣테<br>속마음을 꾸며내고</span>", isChant: true },
      { time: 172.5, text: "繋いだその手は離さないで<br><span class='sub-lyric'>츠나이다 소노테와 하나사나이데<br>잡은 손은 놓지 말아줘</span>", isChant: true },
      { time: 183.0, text: "🎵", isChant: false },
      
      { time: 206.5, text: "意図するなよ<br><span class='sub-lyric'>이토스루나요<br>의도하지마</span>", isChant: false },
      { time: 208.3, text: "この身など<br><span class='sub-lyric'>코노 미나도<br>이 몸 같은 건</span>", isChant: false },
      { time: 209.5, text: "博打だろ<br><span class='sub-lyric'>바쿠치다로<br>도박이잖아</span>", isChant: false },
      { time: 210.9, text: "清々するぜ<br><span class='sub-lyric'>세이세이스루제<br>상쾌하네</span>", isChant: false },
      { time: 212.7, text: "激動、時代の坩堝へ<br><span class='sub-lyric'>게키도 토키노 루츠보에<br>격동하는 시대의 도가니에</span>", isChant: false },
      { time: 215.0, text: "飛び込んでゆくだけさ<br><span class='sub-lyric'>토비콘데 유쿠다케사<br>뛰어들어 갈뿐이야</span>", isChant: false },

      { time: 217.8, text: "“遊びじゃないのよ貴女とは”<br><span class='sub-lyric'>아소비쟈나이노요 아나타토와<br>당신과는 노는 게 아니야</span>", isChant: false },
      { time: 220.1, text: "なんて嘘で固めたこの夜なら<br><span class='sub-lyric'>난테 우소데 카타메타 코노 요나라<br>라고 거짓말로 꾸며낸 이 밤이라면</span>", isChant: false },
      { time: 223.1, text: "冗談もご愛嬌でしょ？<br><span class='sub-lyric'>죠단모 고아이쿄데쇼<br>농담도 애교잖아?</span>", isChant: false },

      { time: 232.5, text: "暴れ回れよ<br><span class='sub-lyric'>아바레 마와레요<br>난폭하게 굴어봐</span>", isChant: false },
      { time: 234.8, text: "哀れだろ？むしゃくしゃするぜ<br><span class='sub-lyric'>아와레다로 무샤쿠샤스루제<br>불쌍하지? 짜증이 나</span>", isChant: false },
      { time: 237.8, text: "喧騒に上がる煙に飛び込んでいくだけさ<br><span class='sub-lyric'>켄소니 아가루 케무리니 토비콘데 이쿠다케사<br>소란스럽게 올라가는 연기에 뛰어들 뿐이야</span>", isChant: false },
      
      { time: 243.1, text: "遊びきるんだ、この世界<br><span class='sub-lyric'>아소비키룬다 코노 세카이<br>이 세상을 마음껏 즐겨보는 거야</span>", isChant: false },
      { time: 245.4, text: "喧騒、狂乱に、雨あられ<br><span class='sub-lyric'>켄소 쿄란니 아메아라레<br>소란과 광란에 흠뻑 젖어</span>", isChant: false },
      { time: 248.5, text: "最後の最後には<br><span class='sub-lyric'>사이고노 사이고니와<br>마지막의 마지막에는</span>", isChant: false },
      { time: 251.2, text: "ニヤリと笑ってみせる<br><span class='sub-lyric'>니야리토 와랏테 미세루<br>방긋 웃어보일게</span>", isChant: false },
      { time: 259.0, text: "🎵", isChant: false }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
