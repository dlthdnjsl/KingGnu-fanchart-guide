<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }

    /* 문장 중간 부분 떼창 스타일 */
    .inline-chant {
      color: #ff6b81;
      transition: all 0.2s ease;
    }

    .lyric-line.active .inline-chant {
      color: #ff4757;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <div class="top-bar">

      { time: 34.1, text: "実況が'<span class='inline-chant'>ほらっほらっほらっ</span>'と煽り<br><span class='sub-lyric'>짓쿄가 '<span class='inline-chant'>호랏 호랏 호랏</span>'토 아오리<br>지금 상황이 <span class='inline-chant'>보란듯이</span> 약올리고</span>", isChant: false },

      { time: 42.7, text: "狂っている程に魅力的<br><span class='sub-lyric'>쿠룻테이루 호도니 미료쿠테키<br>미쳐있는 만큼 매력적</span>", isChant: false },
      { time: 45.6, text: "クタクタクタな日々<br><span class='sub-lyric'>쿠타 쿠타 쿠타나 히비<br>지치는 나날들</span>", isChant: false },
      { time: 48.3, text: "辞めたくても辞められないわ<br><span class='sub-lyric'>야메타쿠테모 야메라레나이와<br>그만두고 싶어도 그렇게는 안돼</span>", isChant: false },

      { time: 51.2, text: "退屈にはお然らばよ<br><span class='sub-lyric'>타이쿠츠니 오사라바요<br>시시함과는 작별이야</span>", isChant: false },

      { time: 55.2, text: "'修羅修羅修羅'<br><span class='sub-lyric'>슈라 슈라 슈라<br>'수라 수라 수라'</span>", isChant: true },
      { time: 57.0, text: "輪廻転生都合よく生きるわ<br><span class='sub-lyric'>린네텐세 츠고요쿠 이키루와<br>윤회전생으로 편하게 살 거야 </span>", isChant: false },

      { time: 59.8, text: "空回り<br><span class='sub-lyric'>카라마와리<br>헛바퀴 돌기</span>", isChant: false },

      // 오류 수정: 63\2.8 -> 62.8

      { time: 65.3, text: "誰か止めてよ心はまだ<br><span class='sub-lyric'>다레카 토메테요 코코로와 마다<br>누군가 멈춰줘 내 마음은 아직</span>", isChant: false },
      { time: 68.1, text: "<span class='inline-chant'>ジタバタバタ</span>逆転狙いならば<br><span class='sub-lyric'><span class='inline-chant'>지타 바타 바타</span> 갸쿠텐 네라이나라바<br><span class='inline-chant'>버둥대며</span> 역전을 노린다면</span>", isChant: false },
      { time: 71.2, text: "付き合うわ何処までも地の果てまでも<br><span class='sub-lyric'>츠키아우와 도코마데모 치노 하테마데모<br>끝까지 함께할께 이 땅의 끝까지</span>", isChant: false },

      { time: 74.1, text: "迷えど進め<br><span class='sub-lyric'>마요에도 스스메<br>주저하면서도 나아가</span>", isChant: false },
      { time: 75.5, text: "バッドエンド越え<br><span class='sub-lyric'>밧도엔도 코에<br>배드엔딩을 넘어</span>", isChant: false },
      { time: 77.0, text: "青空の下その名を叫んでよ<br><span class='sub-lyric'>아오조라노 시타 소노 나오 사켄데요<br>푸른 하늘 아래에서 그 이름을 외쳐줘</span>", isChant: false },
      { time: 79.4, text: "心が途切れ白旗を挙げたって<br><span class='sub-lyric'>코코로가 토기레 시로하타오 아게탓테<br>마음이 무너져서 백기를 들었다고 해도</span>", isChant: false },
      { time: 83.3, text: "何度でも始められるわ<br><span class='sub-lyric'>난도데모 하지메라레루와<br>몇 번이든 다시 시작할 수 있어</span>", isChant: false },

      { time: 85.3, text: "恐れど遊べ<br><span class='sub-lyric'>오소레도 아소베<br>겁내면서도 즐겨</span>", isChant: false },
      { time: 86.5, text: "流れるままに<br><span class='sub-lyric'>나가레루 마마니<br>흘러가는 대로</span>", isChant: false },
      { time: 87.8, text: "涙を流して身体で笑って<br><span class='sub-lyric'>나미다오 나가시테 카라다데 와랏테<br>눈물을 흘리고 온몸으로 웃고</span>", isChant: false },
      { time: 90.8, text: "ココロノママニトーキョーシティ<br><span class='sub-lyric'>코코로노 마마니 토쿄시티<br>마음가는 대로 즐기는 도쿄</span>", isChant: false },
      { time: 93.7, text: "ココロノママニ遊び尽くすわ<br><span class='sub-lyric'>코코로노 마마니 아소비 츠쿠스와<br>마음가는 대로 마음껏 즐길 거야</span>", isChant: false },

      { time: 107.5, text: "この人生たった一度切り<br><span class='sub-lyric'>코노 진세 탓타 이치도키리<br>이 인생은 한 번뿐</span>", isChant: true },
      { time: 110.5, text: "発火する脳味噌が相方<br><span class='sub-lyric'>핫카스루 노미소가 바디<br>발화하는 뇌가 버디</span>", isChant: true },
      { time: 113.1, text: "遊ぶ事も仕事の内<br><span class='sub-lyric'>아소부 코토모 시고토노 우치<br>노는 것도 일의 일부</span>", isChant: true },
      { time: 116.0, text: "君だけの素晴らしき日々<br><span class='sub-lyric'>키미다케노 스바라시키 히비<br>너만을 위한 멋진 나날들</span>", isChant: true },

      { time: 119.2, text: "ドキドキが止まらないわ<br><span class='sub-lyric'>도키도키가 토마라나이와<br>두근거림이 멈추질 않아</span>", isChant: false },
      { time: 122.0, text: "'降参です'<br><span class='sub-lyric'>코우산데스<br>항복입니다</span>", isChant: true },

      { time: 123.8, text: "修羅修羅修羅の道<br><span class='sub-lyric'>슈라 슈라 슈라노 미치<br>수라의 길</span>", isChant: false },
      { time: 126.0, text: "危険な程に楽しいでしょ<br><span class='sub-lyric'>키켄나 호도니 타노시이데쇼<br>위험한 만큼 재밌죠</span>", isChant: false },
      { time: 128.8, text: "ピュアピュアピュアな君に<br><span class='sub-lyric'>퓨아 퓨아 퓨아나 키미니<br>순수한 너에게</span>", isChant: false },
      { time: 132.0, text: "ドキドキが止まらないわ<br><span class='sub-lyric'>도키도키가 토마라나이와<br>두근거림이 멈추질 않아</span>", isChant: false },

      { time: 134.3, text: "退屈にはお然らばよ<br><span class='sub-lyric'>타이쿠츠니 오사라바요<br>시시함과는 작별이야</span>", isChant: false },
      { time: 136.3, text: "'降参です'<br><span class='sub-lyric'>코산데스<br>'항복입니다'</span>", isChant: true },
      { time: 137.3, text: "マンネリです<br><span class='sub-lyric'>만네리데스<br>매너리즘입니다</span>", isChant: false },
      { time: 138.0, text: "'修羅修羅修羅'<br><span class='sub-lyric'>슈라 슈라 슈라<br>'수라 수라 수라'</span>", isChant: true },
      { time: 140.2, text: "輪廻転生都合よく生きるわ<br><span class='sub-lyric'>린네텐세 츠고요쿠 이키루와<br>윤회전생으로 편하게 살 거야 </span>", isChant: false },
      { time: 141.8, text: "'降参です'<br><span class='sub-lyric'>코우산데스<br>'항복입니다'</span>", isChant: true },
      { time: 142.8, text: "空回り<br><span class='sub-lyric'>카라마와리<br>헛바퀴 돌기</span>", isChant: false },
      { time: 143.8, text: "'修羅修羅修羅'<br><span class='sub-lyric'>슈라 슈라 슈라<br>'수라 수라 수라'</span>", isChant: true },

      { time: 146.0, text: "降参です。修羅修羅。<br><span class='sub-lyric'>코우산데스 슈라 슈라<br>항복입니다 수라 수라</span>", isChant: true }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
