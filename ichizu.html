<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - 一途 (떼창 가이드)</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* 메인 일체형 카드 컨테이너 */
    .main-container {
      width: 100%;
      max-width: 560px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      background-color: #000;
      border-bottom: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 영역 (상하 페이드아웃 마스크 & 스크롤바 커스텀) */
    .lyrics-wrapper {
      width: 100%;
      height: 52vh;
      min-height: 280px;
      padding: 24px 16px;
      box-sizing: border-box;
      overflow-y: auto;
      
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 8%,
        black 92%,
        transparent 100%
      );

      scrollbar-width: thin;
      scrollbar-color: #2e2e3a transparent;
    }

    .lyrics-wrapper::-webkit-scrollbar {
      width: 4px;
    }

    .lyrics-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .lyrics-wrapper::-webkit-scrollbar-thumb {
      background-color: #2e2e3a;
      border-radius: 4px;
    }

    .lyric-line {
      padding: 12px 14px;
      margin: 6px 0;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--text-muted);
      transition: all 0.22s ease-out;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #7b7b8a;
      font-weight: 400;
      display: block;
      margin-top: 4px;
      transition: color 0.2s;
    }

    /* 1. 일반 가사 활성 상태 (입체적인 Pill 형태) */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
      transform: scale(1.01);
    }

    .lyric-line.active .sub-lyric {
      color: #b5b5c2;
    }

    /* 2. 떼창 가사 기본 상태 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 3. 떼창 가사 활성 상태 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 14px rgba(255, 71, 87, 0.65);
      background-color: rgba(255, 71, 87, 0.1);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">一途</div>
    <div style="width: 38px;"></div>
  </div>

  <!-- 메인 콘텐츠 영역 -->
  <div class="main-container">
    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <div class="lyrics-wrapper" id="lyricsContainer"></div>
  </div>

  <script>
    const YOUTUBE_VIDEO_ID = 'TbbJUbrkJrg'; 

    const lyricsData = [
      { time: 1.3, text: "🎵(어이 어이 해도 되고 안 해도 되고)", isChant: false },
      { time: 25.1, text: "最期にもう一度 強く抱きしめて<br><span class='sub-lyric'>사이고니 모이치도 츠요쿠 다키시메테<br>마지막으로 한 번만 세게 안아줘</span>", isChant: true },
      { time: 28.1, text: "その後はもう 何も要らないよ<br><span class='sub-lyric'>소노 아토와 모오 나니모 이라나이요<br>그 후엔 아무것도 필요 없어</span>", isChant: true },
      { time: 31.3, text: "僕の未来も 過去も何もかも<br><span class='sub-lyric'>보쿠노 미라이모 카코모 나니모카모<br>내 미래 과거 뭐든</span>", isChant: true },
      { time: 34.5, text: "あなたで満ちれば 後悔は無いよ<br><span class='sub-lyric'>아나타데 미치레바 코카이와 나이요<br>너로 꽉 찬다면 후회는 없어</span>", isChant: true },

      { time: 38.0, text: "生きてる証刻むの<br><span class='sub-lyric'>이키테루 아카시 키자무노<br>살아있다는 증거를 새겨</span>", isChant: false },
      { time: 41.0, text: "悴む心震わして<br><span class='sub-lyric'>카지카무 코코로 후루와시테<br>위축된 마음을 흔들고</span>", isChant: false },
      { time: 44.0, text: "天秤なんて必要ないの<br><span class='sub-lyric'>텐빈난테 히츠요나이노<br>천칭 같은 건 필요 없어</span>", isChant: false },
      { time: 46.5, text: "矛盾に脳を惑わして<br><span class='sub-lyric'>무쥰니 노오 마도와시테<br>모순적으로 뇌를 유혹하고</span>", isChant: false },


      { time: 49.8, text: "正義と悪など 揺らいでしまう程<br><span class='sub-lyric'>세이기토 아쿠나도 유라이데 시마우호도<br>정의와 악이 흔들려버릴 정도로</span>", isChant: false },
      { time: 52.6, text: "生き急いでいた エンドロールは<br><span class='sub-lyric'>이키이소이데이타 엔도로루와<br>급한 페이스의 삶의 엔드롤은</span>", isChant: false },
      { time: 55.7, text: "きっと神様の 身勝手な悪戯<br><span class='sub-lyric'>킷토 카미사마노 미갓테나 이타즈라<br>분명 신의 제멋대로인 장난</span>", isChant: false },
      { time: 58.6, text: "汚れ役だろうと 厭わないよ<br><span class='sub-lyric'>요고레 야쿠다로토 이토와나이요<br>더러운 역할이라 해도 싫지 않아</span>", isChant: false },

      { time: 62.4, text: "矛盾だらけお互い様ね<br><span class='sub-lyric'>무쥰다라케 오타가이사마네<br>모순 투성이인 건 피차일반이네</span>", isChant: false },
      { time: 65.5, text: "不幸話の背比べ<br><span class='sub-lyric'>후코바나시노 세쿠라베<br>불행한 이야기의 도토리 키 재기</span>", isChant: false },
      { time: 68.3, text: "首の皮一枚 瀬戸際に<br><span class='sub-lyric'>쿠비노 카와이치마이 세토키와니<br>목 한 동강이 운명의 갈림길에서</span>", isChant: false },
      { time: 71.5, text: "足掻いてちゃ 白々しいね<br><span class='sub-lyric'>아가이테챠 시라지라시이네<br>발버둥 치는 게 뻔뻔하네</span>", isChant: false },

      { time: 74.9, text: "ひとひらの想いよ 届け届けと血を巡らせて<br><span class='sub-lyric'>히토히라노 오모이요 토도케 토도케토 치오 메구라세테<br>한 조각의 마음이 닿으라며 피를 돌게 해서</span>", isChant: false },
      { time: 80.8, text: "一途に見つめます 理由なんて必要は無いの<br><span class='sub-lyric'>이치즈니 미츠메마스 와케난테 히츠요와 나이노<br>줄곧 바라볼게 이유는 필요 없어</span>", isChant: false },
      { time: 82.5, text: "🎵(어이 어이 해도 되고 안 해도 되고)", isChant: false },
      { time: 103.8, text: "👏涙の理由も知らずに 愛が体を喰いちぎった<br><span class='sub-lyric'>나미다노 와케모 시라즈니 아이가 카라다오 쿠이치깃타<br>눈물의 이유도 모르고 사랑이 몸을 물어뜯었어</span>", isChant: false },
      { time: 110.0, text: "👏正しさを振りかざさないで 事実が理由を喰いちぎった<br><span class='sub-lyric'>타다시사오 후리카자사나이데 지지츠가 와케오 쿠이치깃타<br>옳음을 내세우지도 않은 채로 사실이 이성을 물어뜯었어</span>", isChant: false },

      { time: 117.7, text: "鼓動が止まぬように<br><span class='sub-lyric'>코도가 야마누 요오니<br>고동이 멈추지 않게</span>", isChant: false },
      { time: 119.7, text: "喧騒に薪を焚べんだ<br><span class='sub-lyric'>코도가 야마누 요오니 켄소니 마키오 쿠벤다<br>난장판에 불을 더 지폈어</span>", isChant: false },
      { time: 124.5, text: "帳を張る事すら<br><span class='sub-lyric'>토바리오 하루 코토스라<br>장막을 치는 것마저</span>", isChant: false },
      { time: 127.0, text: "無粋な気がしてんだ<br><span class='sub-lyric'>부스이나 키가 시텐다<br>촌스러운 기분이 들었어</span>", isChant: false },


      { time: 130.2, text: "さあ来世に期待ね 光れ閃け猛スピードで<br><span class='sub-lyric'>사아 라이세이니 키타이네 히카레 히라메케 모스피도데<br>자 다음 생에 기대할게 빛나고 번쩍이는 저돌적인 스피드로</span>", isChant: false },
      { time: 136.2, text: "一途に向かいます 余力を残す気は無いの<br><span class='sub-lyric'>이치즈니 무카이마스 요료쿠오 노코스 키와 나이노<br>줄곧 향할게 여력을 남길 때가 아니야</span>", isChant: false },

      { time: 143.2, text: "届け届けと血を巡らせて<br><span class='sub-lyric'>토도케 토도케토 치오 메구라세테<br>닿으라며 피를 돌게 해서</span>", isChant: false },
      { time: 148.3, text: "一途に愛します<br><span class='sub-lyric'>이치즈니 아이시마스<br>줄곧 사랑할게</span>", isChant: false },
      { time: 151.0, text: "永遠なんて必要は無いの<br><span class='sub-lyric'>토와난테 히츠요와 나이노<br>영원은 필요 없어</span>", isChant: false },

      { time: 160.0, text: "最期にもう一度 強く抱きしめて<br><span class='sub-lyric'>사이고니 모오 이치도 츠요쿠 다키시메테<br>마지막으로 한 번만 세게 안아줘</span>", isChant: true },
      { time: 163.2, text: "その後はもう 何も要らないよ<br><span class='sub-lyric'>소노 아토와 모오 나니모 이라나이요<br>그 후엔 아무것도 필요 없어</span>", isChant: true },
      { time: 166.2, text: "見えない未来も 消せぬ過去さえも<br><span class='sub-lyric'>미에나이 미라이모 케세누 카코사에모<br>보이지 않는 미래도 지울 수 없는 과거마저도</span>", isChant: true },
      { time: 169.2, text: "あなたで満ちれば 後悔はないよ<br><span class='sub-lyric'>아나타데 미치레바 코카이와 나이요<br>너로 가득 찬다면 후회는 없어</span>", isChant: true },

      { time: 172.0, text: "最期にもう一度 力を貸して<br><span class='sub-lyric'>사이고니 모오 이치도 치카라오 카시테<br>마지막으로 한 번만 힘을 빌려줘</span>", isChant: true },
      { time: 174.8, text: "その後はもう 何も要らないよ<br><span class='sub-lyric'>소노 아토와 모오 나니모 이라나이요<br>그 후엔 아무것도 필요 없어</span>", isChant: true },
      { time: 178.3, text: "僕の未来も 心も体も<br><span class='sub-lyric'>보쿠노 미라이모 코코로모 카라다모<br>내 미래도 마음도 몸도</span>", isChant: true },
      { time: 181.3, text: "あなたにあげるよ 全部全部<br><span class='sub-lyric'>아나타니 아게루요 젠부젠부<br>너에게 줄게 전부 전부</span>", isChant: true },

      /* 라이브 버전 특유의 후반부 젠부 떼창 파트 추가 */
      { time: 191.5, text: "全部全部<br><span class='sub-lyric'>젠부젠부<br>전부 전부</span>", isChant: true },
      { time: 197.0, text: "全部全部<br><span class='sub-lyric'>젠부젠부<br>전부 전부</span>", isChant: true },
      { time: 201.8, text: "全部全部<br><span class='sub-lyric'>젠부젠부<br>전부 전부</span>", isChant: true },
      { time: 206.5, text: "全部全部<br><span class='sub-lyric'>젠부젠부<br>전부 전부</span>", isChant: true },
      { time: 211.0, text: "全部全部<br><span class='sub-lyric'>젠부젠부<br>전부 전부</span>", isChant: true }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
