<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - Teenager Forever</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
      transform: translateX(-2px);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    /* 일반 가사 재생 중 강조 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.05rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 떼창 가사 기본 상태 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 떼창 가사 재생 중 강조 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <!-- 상단 뒤로가기 및 제목 -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">←</a>
    <div class="page-title">Teenager Forever</div>
    <div style="width: 38px;"></div>
  </div>

  <!-- 유튜브 동영상 영역 -->
  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <!-- 가사 스크롤 영역 -->
  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    // YouTube Video ID (https://youtu.be/XPUN-w543bc)
    const YOUTUBE_VIDEO_ID = 'XPUN-w543bc'; 

    // 한소절 시작 시 0.1~0.2초 여유를 둔 타임스탬프 데이터
    const lyricsData = [
      { time: 3.3, text: "他の誰かになんてなれやしないよ<br><span class='sub-lyric'>호카노 다레카니 난테 나레야시나이요<br>다른 누군가가 될 수 있을리 없어</span>", isChant: false },
      { time: 8.3, text: "そんなのわかってるんだ<br><span class='sub-lyric'>손나노 와캇테룬다<br>그런 것쯤은 알고 있어</span>", isChant: false },
      { time: 11.8, text: "明日を信じてみたいの<br><span class='sub-lyric'>아스오 신지테미타이노<br>내일을 믿어보고 싶어</span>", isChant: false },
      { time: 14.7, text: "微かな自分を愛せなかったとしても<br><span class='sub-lyric'>카스카나 지분오 아이세나캇타토시테모<br>초라한 나 자신을 사랑할 수 없다고 해도</span>", isChant: false },

      { time: 20.7, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 25.5, text: "T-t-t-t- teenager forever", isChant: true },
      { time: 29.7, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 33.5, text: "T-t-t-t- teenager forever", isChant: true },

      { time: 37.0, text: "望んだこと全てが叶うわけはないよ<br><span class='sub-lyric'>노존다 코토 스베테가 카나우와케와 나이요<br>바라왔던 모든 게 이루어질 수는 없어</span>", isChant: false },
      { time: 41.8, text: "そんなのわかってるんだ<br><span class='sub-lyric'>손나노 와캇테룬다<br>그런 것쯤은 알고 있어</span>", isChant: false },
      { time: 45.3, text: "深い傷もいずれはかさぶたに変わって<br><span class='sub-lyric'>후카이 키즈모 이즈레와 카사부타니 카왓테<br>깊은 상처도 언젠가 흉터로 바뀌어서</span>", isChant: false },
      { time: 50.3, text: "剥がれ落ちるだろうか<br><span class='sub-lyric'>하가레 오치루다로오카<br>벗겨져 떨어지는 걸까</span>", isChant: false },

      { time: 53.8, text: "いつまでも相変わらず つまらない話を<br><span class='sub-lyric'>이츠마데모 아이카와라즈 츠마라나이 하나시오<br>언제까지나 변함없이 시시한 이야기를</span>", isChant: false },
      { time: 58.2, text: "つまらない中に どこまでも幸せを探すよ<br><span class='sub-lyric'>츠마라나이 나카니 도코마데모 시아와세오 사가스요<br>지루한 삶 속에서 어디까지나 행복을 찾을 거야</span>", isChant: false },

      { time: 63.2, text: "伝えたい想いは溢れてるのに<br><span class='sub-lyric'>츠타에타이 오모이와 아후레테루노니<br>전하고 싶은 마음은 넘쳐흐르고 있는데</span>", isChant: false },
      { time: 67.0, text: "伝え方が分からなくて 今でも言葉を探してるんだ<br><span class='sub-lyric'>츠타에카타가 와카라나쿠테 이마데모 코토바오 사가시테룬다<br>전할 방법을 모르겠어서 지금도 말을 고르고 있어</span>", isChant: false },
      { time: 71.5, text: "遠くに散っていった夢の欠片に<br><span class='sub-lyric'>토오쿠니 칫테잇타 유메노 카케라니<br>멀리 흩뿌려져있던 꿈의 조각에</span>", isChant: false },
      { time: 75.3, text: "めくるめくあなたの煌めきに 気づけたらいいんだ<br><span class='sub-lyric'>메쿠루메쿠 아나타노 키라메키니 키즈케타라 이인다<br>눈이 부신 당신의 반짝임을 알아채면 돼</span>", isChant: false },

      { time: 80.0, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 84.0, text: "T-t-t-t- teenager forever", isChant: true },
      { time: 88.2, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 92.5, text: "T-t-t-t- teenager forever", isChant: true },

      { time: 96.3, text: "結局のところ誰も教えちゃくれないんだ<br><span class='sub-lyric'>켓쿄쿠노 토코로 다레모 오시에챠 쿠레나인다<br>결국 아무도 알려주지 않아</span>", isChant: false },
      { time: 101.3, text: "進むべき道なんて<br><span class='sub-lyric'>스스무베키 미치난테<br>가야할 길 같은 건</span>", isChant: false },
      { time: 104.9, text: "等身大のままで生きていこうぜ<br><span class='sub-lyric'>토신다이노 마마데 이키테이코오제<br>있는 그대로의 모습으로 살아가자</span>", isChant: false },
      { time: 109.8, text: "歳を重ねても<br><span class='sub-lyric'>토시오 카사네테모<br>나이를 먹어도</span>", isChant: false },

      { time: 113.2, text: "いつまでも相変わらず つまらない話を<br><span class='sub-lyric'>이츠마데모 아이카와라즈 츠마라나이 하나시오<br>언제까지나 변함없이 시시한 이야기를</span>", isChant: false },
      { time: 117.7, text: "つまらない中に どこまでも幸せを探すよ<br><span class='sub-lyric'>츠마라나이 나카니 도코마데모 시아와세오 사가스요<br>지루한 삶 속에서 어디까지나 행복을 찾을 거야</span>", isChant: false },
      { time: 123.0, text: "煌めきを探してよ<br><span class='sub-lyric'>키라메키오 사카시테요<br>반짝임을 찾아줘</span>", isChant: true },

      { time: 126.0, text: "散々振り回して振り回されて<br><span class='sub-lyric'>산잔 후리마와시테 후리마와사레테<br>마음껏 휘두르고 휘둘러지고</span>", isChant: false },
      { time: 129.7, text: "大事なのはあなただってことに 気づかないままで<br><span class='sub-lyric'>다이지나노와 아나타닷테 코토니 키즈카나이마마데<br>중요한 건 당신이라는 사실을 깨닫지 못한채로</span>", isChant: false },
      { time: 134.0, text: "一体未来はどうなるのかなんてことより<br><span class='sub-lyric'>잇타이 미라이와 도오 나루노카 난테 코토요리<br>도대체 미래는 어떻게 되는지 같은 것 보다</span>", isChant: false },
      { time: 138.0, text: "めくるめく今という煌めきに 気づけたらいいんだ<br><span class='sub-lyric'>메쿠루메쿠 이마토이우 키라메키니 키즈케타라 이인다<br>눈이 부신 지금이라는 반짝임을 알아채면 되는 거야</span>", isChant: false },

      { time: 143.0, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 147.0, text: "T-t-t-t- teenager forever", isChant: true },
      { time: 150.8, text: "T-t-t-t- teenager forever (T-t-t-t- teenager forever)", isChant: true },
      { time: 155.0, text: "T-t-t-t- teenager forever", isChant: true },

      { time: 158.9, text: "他の誰かになんてなれやしないよ<br><span class='sub-lyric'>호카노 다레카니 난테 나레야 시나이요<br>다른 누군가가 될 수 있을리 없어</span>", isChant: true },
      { time: 164.8, text: "そんなのわかってるんだ<br><span class='sub-lyric'>손나노 와캇테룬다<br>그런 것쯤은 알고 있어</span>", isChant: true },
      { time: 168.2, text: "明日を信じてみたいの<br><span class='sub-lyric'>아스오 신지테미타이노<br>내일을 믿어보고 싶어</span>", isChant: true },
      { time: 171.8, text: "微かな自分を愛せなかったとしても<br><span class='sub-lyric'>카스카나 지분오 아이세나캇타 토시테모<br>초라한 나 자신을 사랑할 수 없다고 해도</span>", isChant: true }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
