<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu Live Chant Guide</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --card-hover: #23232a;
      --accent-color: #ff4757;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 검색창 */
    .search-box {
      width: 100%;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    /* 곡 리스트 그리드 */
    .song-grid {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 곡 카드 */
    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .song-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .song-album {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .badge-chant {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: rgba(255, 71, 87, 0.12);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    /* 푸터 */
    footer {
      margin-top: auto;
      padding-top: 40px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>King Gnu <span>Fan Chant Guide</span></h1>
    <p>킹누 라이브 떼창 가이드</p>
  </header>

  <!-- 곡 검색 기능 -->
  <div class="search-box">
    <input type="text" id="searchInput" onkeyup="filterSongs()" placeholder="곡 제목 검색">
  </div>

  <!-- 곡 목록 -->
  <div class="song-grid" id="songList">
    
    <!-- 곡 1 -->
    <a href="specialz.html" class="song-card">
      <div class="song-info">
        <div class="song-title">SPECIALZ</div>
        <div class="song-album">주술회전 2기 OP</div>
      </div>
      <span class="badge-chant">떼창가이드</span>
    </a>

    <!-- 곡 2 -->
    <a href="teenagerforever.html" class="song-card">
      <div class="song-info">
        <div class="song-title">Teenager Forever</div>
        <div class="song-album">CEREMONY</div>
      </div>
      <span class="badge-chant">떼창가이드</span>
    </a>

    <!-- 곡 3 -->
    <a href="flash.html" class="song-card">
      <div class="song-info">
        <div class="song-title">Flash!!</div>
        <div class="song-album">Sympa</div>
      </div>
      <span class="badge-chant">떼창가이드</span>
    </a>

    <!-- 곡 4 -->
    <a href="amesansan.html" class="song-card">
      <div class="song-info">
        <div class="song-title">雨燦々</div>
        <div class="song-album">THE GREATEST UNKNOWN</div>
      </div>
      <span class="badge-chant">떼창가이드</span>
    </a>
    
     <!-- 곡 5 -->
    <a href="vinyl.html" class="song-card">
      <div class="song-info">
        <div class="song-title">Vinyl</div>
        <div class="song-album">Tokyo Rendez-Vous</div>
      </div>
      <span class="badge-chant">떼창가이드</span>
    </a>

  </div>

  <footer>
    <p>King Gnu Fan Chant Guide</p>
  </footer>

  <script>
    // 검색 필터링 함수
    function filterSongs() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const songList = document.getElementById('songList');
      const cards = songList.getElementsByClassName('song-card');

      for (let i = 0; i < cards.length; i++) {
        const title = cards[i].querySelector('.song-title').innerText;
        const album = cards[i].querySelector('.song-album').innerText;
        
        if (title.toLowerCase().includes(filter) || album.toLowerCase().includes(filter)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }
  </script>
</body>
</html>
