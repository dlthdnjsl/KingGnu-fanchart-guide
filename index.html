<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu Live Chant Guide</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --card-hover: #23232a;
      --accent-color: #ff4757;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: clamp(1.35rem, 5.5vw, 1.8rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      white-space: nowrap;
    }

    header h1 span {
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .controls-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* 검색창 크기 축소 (패딩 및 폰트 슬림화) */
    .search-box input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    /* 토글 정렬 버튼 컨테이너: 3등분 그리드로 모바일 1줄 고정 */
    .sort-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    /* 버튼 크기 및 텍스트 자동 축소 */
    .sort-btn {
      padding: 7px 4px;
      border-radius: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: clamp(0.7rem, 2.7vw, 0.82rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      transition: all 0.2s ease;
      user-select: none;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: #444455;
    }

    .sort-btn.active {
      background-color: rgba(255, 71, 87, 0.15);
      border-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: 600;
    }

    .song-grid {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .song-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .song-album {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .badge-chant {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: rgba(255, 71, 87, 0.12);
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 71, 87, 0.3);
      white-space: nowrap;
    }

    footer {
      margin-top: auto;
      padding-top: 36px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
  
  <meta property="og:title" content="King Gnu Live Chant Guide">
  <meta property="og:description" content="King Gnu 라이브 응원법 가이드">
  <meta property="og:image" content="https://kinggnu-fanchant-guide-kr.pages.dev/og-image.jpg">
  
  <!-- 트위터(X) 공유 대응 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kinggnu-fanchant-guide-kr.pages.dev/og-image.jpg">
</head>
<body>

  <header>
    <h1>King Gnu <span>떼창 가이드</span></h1>
  </header>

  <div class="controls-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목 또는 앨범 검색...">
    </div>

    <!-- 3등분 그리드 1줄 배치 -->
    <div class="sort-container">
      <button class="sort-btn active" id="btnSortName">이름순 ↑ (A-Z)</button>
      <button class="sort-btn" id="btnSortYear">발매연도순 ↑ (과거순)</button>
      <button class="sort-btn" id="btnSortAlbum">앨범순 ↑ (1집부터)</button>
    </div>
  </div>

  <div class="song-grid" id="songList"></div>

  <footer>
    <p>© 2026 zzezzal. All rights reserved.</p>
  </footer>

  <script>
    const songData = [
      { title: "SPECIALZ", album: "THE GREATEST UNKNOWN", year: 2023, url: "specialz.html", badge: "HOT" },
      { title: "Teenager Forever", album: "CEREMONY", year: 2020, url: "teenagerforever.html", badge: "HOT" },
      { title: "Flash!!!", album: "Sympa", year: 2019, url: "flash.html", badge: "" },
      { title: "雨燦々", album: "THE GREATEST UNKNOWN", year: 2022, url: "amesansan.html", badge: "HOT" },
      { title: "Vinyl", album: "Tokyo Rendez-Vous", year: 2017, url: "vinyl.html", badge: "" },
      { title: "AIZO", album: "주술회전 3기 OP", year: 2026, url: "aizo.html", badge: "HOT" },
      { title: "一途", album: "THE GREATEST UNKNOWN", year: 2021, url: "ichizu.html", badge: "" },
      { title: "飛行艇", album: "CEREMONY", year: 2019, url: "hikoutei.html", badge: "HOT" },
      { title: "TWILIGHT!!!", album: "명탐정 코난: 흑철의 어영 ED", year: 2025, url: "twilight.html", badge: "" },
      { title: "ねっこ", album: "", year: 2024, url: "nekko.html", badge: "" },
      { title: "SO BAD", album: "유니버셜 스튜디오 Zombie de Dance 테마송", year: 2024, url: "sobad.html", badge: "HOT" },
      { title: "Prayer X", album: "Sympa", year: 2018, url: "prayerx.html", badge: "HOT" },
      { title: "STARDOM", album: "THE GREATEST UNKNOWN", year: 2022, url: "stardom.html", badge: "" },
      { title: "Slumberland", album: "Sympa", year: 2018, url: "slumberland.html", badge: "" },
      { title: "Sorrows", album: "Sympa", year: 2019, url: "sorrows.html", badge: "" },
      { title: "):阿修羅:(", album: "THE GREATEST UNKNOWN", year: 2023, url: "asura.html", badge: "" }
    ];

    let currentSortMode = "name-asc";

    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const btnSortName = document.getElementById("btnSortName");
    const btnSortYear = document.getElementById("btnSortYear");
    const btnSortAlbum = document.getElementById("btnSortAlbum");
    const allButtons = [btnSortName, btnSortYear, btnSortAlbum];

    const customJapaneseOrder = [
      "):阿修羅:(",
      "雨燦々",
      "一途",
      "ねっこ",
      "飛行艇"
    ];

    function getCharPriority(title) {
      const firstChar = title.trim().charAt(0);
      if (title.includes("阿修羅")) return 3;
      if (/[a-zA-Z]/.test(firstChar)) return 1;
      if (/[가-힣]/.test(firstChar)) return 2;
      return 3;
    }

    function getAlbumPriority(album) {
      const a = (album || "").toLowerCase();
      if (a.includes("tokyo rendez-vous")) return 1;
      if (a.includes("sympa")) return 2;
      if (a.includes("ceremony")) return 3;
      if (a.includes("greatest unknown")) return 4;
      return 5;
    }

    function renderList() {
      const query = searchInput.value.toLowerCase().trim();

      let filtered = songData.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.album.toLowerCase().includes(query)
      );

      // 이름순 오름차순(A-Z)
      if (currentSortMode === "name-asc") {
        filtered.sort((a, b) => {
          const pA = getCharPriority(a.title);
          const pB = getCharPriority(b.title);
          if (pA !== pB) return pA - pB;

          if (pA === 3) {
            const idxA = customJapaneseOrder.indexOf(a.title);
            const idxB = customJapaneseOrder.indexOf(b.title);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
          }
          return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
        });
      } 
      // 이름순 내림차순(Z-A)
      else if (currentSortMode === "name-desc") {
        filtered.sort((a, b) => {
          const pA = getCharPriority(a.title);
          const pB = getCharPriority(b.title);
          if (pA !== pB) return pB - pA;

          if (pA === 3) {
            const idxA = customJapaneseOrder.indexOf(a.title);
            const idxB = customJapaneseOrder.indexOf(b.title);
            if (idxA !== -1 && idxB !== -1) return idxB - idxA;
            if (idxA !== -1) return 1;
            if (idxB !== -1) return -1;
          }
          return b.title.localeCompare(a.title, undefined, { sensitivity: 'base' });
        });
      } 
      // 발매연도 오름차순(과거순)
      else if (currentSortMode === "year-asc") {
        filtered.sort((a, b) => a.year - b.year);
      } 
      // 발매연도 내림차순(최신순)
      else if (currentSortMode === "year-desc") {
        filtered.sort((a, b) => b.year - a.year);
      }
      // 앨범순 오름차순 (도쿄 랑데부 -> 심파 -> 세레머니 -> 더 그레이티스트 언노운 -> 기타)
      else if (currentSortMode === "album-asc") {
        filtered.sort((a, b) => {
          const pA = getAlbumPriority(a.album);
          const pB = getAlbumPriority(b.album);
          if (pA !== pB) return pA - pB;
          return a.year - b.year || a.title.localeCompare(b.title);
        });
      }
      // 앨범순 내림차순 (기타 최신 -> 더 그레이티스트 언노운 -> 세레머니 -> 심파 -> 도쿄 랑데부)
      else if (currentSortMode === "album-desc") {
        filtered.sort((a, b) => {
          const pA = getAlbumPriority(a.album);
          const pB = getAlbumPriority(b.album);
          if (pA !== pB) return pB - pA;
          return b.year - a.year || a.title.localeCompare(b.title);
        });
      }

      songListEl.innerHTML = "";
      if (filtered.length === 0) {
        songListEl.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 40px 0;">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach(song => {
        const card = document.createElement("a");
        card.href = song.url;
        card.className = "song-card";
        const badgeHtml = song.badge ? `<span class="badge-chant">${song.badge}</span>` : "";

        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-album">${song.album}</div>
          </div>
          ${badgeHtml}
        `;
        songListEl.appendChild(card);
      });
    }

    function setActiveBtn(activeBtn) {
      allButtons.forEach(btn => btn.classList.remove("active"));
      activeBtn.classList.add("active");
    }

    // 이름순 토글 클릭
    btnSortName.addEventListener("click", () => {
      setActiveBtn(btnSortName);
      if (currentSortMode === "name-asc") {
        currentSortMode = "name-desc";
        btnSortName.innerText = "이름순 ↓ (Z-A)";
      } else {
        currentSortMode = "name-asc";
        btnSortName.innerText = "이름순 ↑ (A-Z)";
      }
      renderList();
    });

    // 발매연도순 토글 클릭
    btnSortYear.addEventListener("click", () => {
      setActiveBtn(btnSortYear);
      if (currentSortMode === "year-asc") {
        currentSortMode = "year-desc";
        btnSortYear.innerText = "발매연도순 ↓ (최신순)";
      } else {
        currentSortMode = "year-asc";
        btnSortYear.innerText = "발매연도순 ↑ (과거순)";
      }
      renderList();
    });

    // 앨범순 토글 클릭
    btnSortAlbum.addEventListener("click", () => {
      setActiveBtn(btnSortAlbum);
      if (currentSortMode === "album-asc") {
        currentSortMode = "album-desc";
        btnSortAlbum.innerText = "앨범순 ↓ (최신앨범부터)";
      } else {
        currentSortMode = "album-asc";
        btnSortAlbum.innerText = "앨범순 ↑ (1집부터)";
      }
      renderList();
    });

    searchInput.addEventListener("input", renderList);

    renderList();
  </script>
</body>
</html>
