<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu Live Chant Guide</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0d0d10;
      --card-bg: #16161b;
      --card-hover: #1f1f26;
      --accent-color: #ff4757;
      --text-main: #ffffff;
      --text-sub: #9494a0;
      --border-color: #262633;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      /* 상단에 은은한 다크레드 방사형 그라디언트 적용 */
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #2a1216 0%, #0d0d10 65%);
      background-repeat: no-repeat;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 36px 16px 40px;
    }

    /* 헤더 타이포그래피 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-family: 'Montserrat', 'Pretendard', sans-serif;
      font-size: clamp(1.4rem, 6vw, 2.1rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    header h1 span {
      color: var(--accent-color);
      text-shadow: 0 0 16px rgba(255, 71, 87, 0.4);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.9rem;
      letter-spacing: -0.3px;
    }

    /* 전곡 MV 연속 감상 (STATION) 아코디언 섹션 */
    .station-accordion {
      width: 100%;
      max-width: 600px;
      margin-bottom: 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .station-accordion:hover {
      border-color: #383848;
    }

    .station-toggle-btn {
      width: 100%;
      background: none;
      border: none;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--text-main);
      font-family: inherit;
    }

    .station-title {
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .station-title span {
      color: var(--accent-color);
      font-size: 0.75rem;
    }

    .station-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .station-tag {
      font-size: 0.7rem;
      color: var(--text-sub);
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .station-arrow {
      font-size: 0.75rem;
      color: var(--text-sub);
      transition: transform 0.25s ease;
    }

    .station-arrow.open {
      transform: rotate(180deg);
    }

    .station-body {
      display: none;
      padding: 0 14px 14px;
    }

    .station-body.open {
      display: block;
    }

    .station-player-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .station-player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 컨트롤러 (검색 & 정렬) */
    .controls-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    .sort-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
    }

    .sort-btn {
      padding: 8px 4px;
      border-radius: 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: clamp(0.72rem, 2.7vw, 0.83rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: all 0.2s ease;
      user-select: none;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: #404050;
    }

    .sort-btn.active {
      background-color: rgba(255, 71, 87, 0.12);
      border-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: 700;
    }

    /* 곡 카드 리스트 */
    .song-grid {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 3.5px solid #444455; /* 기본 좌측 컬러 바 */
      border-radius: 12px;
      padding: 15px 18px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    /* 앨범별 시그니처 좌측 컬러 포인트 */
    .song-card.album-tokyo { border-left-color: #636e72; }
    .song-card.album-sympa { border-left-color: #e17055; }
    .song-card.album-ceremony { border-left-color: #d63031; }
    .song-card.album-greatest { border-left-color: #0984e3; }
    .song-card.album-single { border-left-color: #a29bfe; }

    .song-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .song-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .song-album {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .card-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-chant {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: rgba(255, 71, 87, 0.12);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 71, 87, 0.3);
      white-space: nowrap;
    }

    .arrow-icon {
      color: #555566;
      font-size: 1rem;
      font-weight: 600;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .song-card:hover .arrow-icon {
      color: var(--accent-color);
      transform: translateX(3px);
    }

    footer {
      margin-top: auto;
      padding-top: 36px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
