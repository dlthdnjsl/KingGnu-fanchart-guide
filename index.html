<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu Live Chant Guide</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --card-hover: #23232a;
      --accent-color: #ff4757;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .controls-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    /* 토글 정렬 버튼 컨테이너 */
    .sort-container {
      display: flex;
      gap: 8px;
    }

    .sort-btn {
      padding: 7px 16px;
      border-radius: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: #444455;
    }

    .sort-btn.active {
      background-color: rgba(255, 71, 87, 0.15);
      border-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: 600;
    }

    .song-grid {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .song-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .song-album {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .badge-chant {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: rgba(255, 71, 87, 0.12);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 71, 87, 0.3);
      white-space: nowrap;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>King Gnu <span>Fan Chant Guide</span></h1>
    <p>킹누 라이브 떼창 가이드</p>
  </header>

  <div class="controls-wrapper">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목 또는 앨범 검색...">
    </div>

    <!-- 2가지 토글 버튼 -->
    <div class="sort-container">
      <button class="sort-btn active" id="btnSortName" data-type="name">이름순 ↑ (A-Z)</button>
      <button class="sort-btn" id="btnSortYear" data-type="year">발매연도순 ↑ (과거순)</button>
    </div>
  </div>

  <div class="song-grid" id="songList"></div>

  <footer>
    <p>King Gnu Fan Chant Guide</p>
  </footer>

  <script>
    const songData = [
      { title: "SPECIALZ", album: "주술회전 2기 OP", year: 2023, url: "specialz.html", badge: "HOT" },
      { title: "Teenager Forever", album: "CEREMONY", year: 2020, url: "teenagerforever.html", badge: "HOT" },
      { title: "Flash!!!", album: "Sympa", year: 2019, url: "flash.html", badge: "" },
      { title: "雨燦々", album: "THE GREATEST UNKNOWN", year: 2022, url: "amesansan.html", badge: "HOT" },
      { title: "Vinyl", album: "Tokyo Rendez-Vous", year: 2017, url: "vinyl.html", badge: "" },
      { title: "AIZO", album: "주술회전 3기 OP", year: 2026, url: "aizo.html", badge: "HOT" },
      { title: "一途", album: "주술회전 0 OST", year: 2021, url: "ichizu.html", badge: "" },
      { title: "飛行艇", album: "CEREMONY", year: 2019, url: "hikoutei.html", badge: "HOT" },
      { title: "TWILIGHT!!!", album: "명탐정 코난: 흑철의 어영 ED", year: 2025, url: "twilight.html", badge: "" },
      { title: "ねっこ", album: "", year: 2024, url: "nekko.html", badge: "" },
      { title: "SO BAD", album: "", year: 2024, url: "sobad.html", badge: "HOT" },
      { title: "Prayer X", album: "Sympa", year: 2018, url: "prayerx.html", badge: "HOT" },
      { title: "STARDOM", album: "THE GREATEST UNKNOWN", year: 2022, url: "stardom.html", badge: "" },
      { title: "Slumberland", album: "Sympa", year: 2018, url: "slumberland.html", badge: "" },
      { title: "Sorrows", album: "Sympa", year: 2019, url: "sorrows.html", badge: "" },
      { title: "):阿修羅:(", album: "THE GREATEST UNKNOWN", year: 2023, url: "asura.html", badge: "" }
    ];

    // 정렬 상태 관리 (name-asc, name-desc, year-asc, year-desc)
    let currentSortMode = "name-asc";

    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const btnSortName = document.getElementById("btnSortName");
    const btnSortYear = document.getElementById("btnSortYear");

    const customJapaneseOrder = [
      "):阿修羅:(",
      "雨燦々",
      "一途",
      "ねっこ",
      "飛行艇"
    ];

    function getCharPriority(title) {
      const firstChar = title.trim().charAt(0);
      if (title.includes("阿修羅")) return 3;
      if (/[a-zA-Z]/.test(firstChar)) return 1;
      if (/[가-힣]/.test(firstChar)) return 2;
      return 3;
    }

    function renderList() {
      const query = searchInput.value.toLowerCase().trim();

      let filtered = songData.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.album.toLowerCase().includes(query)
      );

      // 이름순 오름차순(A-Z)
      if (currentSortMode === "name-asc") {
        filtered.sort((a, b) => {
          const pA = getCharPriority(a.title);
          const pB = getCharPriority(b.title);
          if (pA !== pB) return pA - pB;

          if (pA === 3) {
            const idxA = customJapaneseOrder.indexOf(a.title);
            const idxB = customJapaneseOrder.indexOf(b.title);
            if (idxA !== -1 && idxB !== -1) return idxA - idxB;
            if (idxA !== -1) return -1;
            if (idxB !== -1) return 1;
          }
          return a.title.localeCompare(b.title, undefined, { sensitivity: 'base' });
        });
      } 
      // 이름순 내림차순(Z-A)
      else if (currentSortMode === "name-desc") {
        filtered.sort((a, b) => {
          const pA = getCharPriority(a.title);
          const pB = getCharPriority(b.title);
          if (pA !== pB) return pB - pA; // 일본어 -> 한글 -> 영문 역순

          if (pA === 3) {
            const idxA = customJapaneseOrder.indexOf(a.title);
            const idxB = customJapaneseOrder.indexOf(b.title);
            if (idxA !== -1 && idxB !== -1) return idxB - idxA;
            if (idxA !== -1) return 1;
            if (idxB !== -1) return -1;
          }
          return b.title.localeCompare(a.title, undefined, { sensitivity: 'base' });
        });
      } 
      // 발매연도 오름차순(과거순)
      else if (currentSortMode === "year-asc") {
        filtered.sort((a, b) => a.year - b.year);
      } 
      // 발매연도 내림차순(최신순)
      else if (currentSortMode === "year-desc") {
        filtered.sort((a, b) => b.year - a.year);
      }

      songListEl.innerHTML = "";
      if (filtered.length === 0) {
        songListEl.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 40px 0;">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach(song => {
        const card = document.createElement("a");
        card.href = song.url;
        card.className = "song-card";
        const badgeHtml = song.badge ? `<span class="badge-chant">${song.badge}</span>` : "";

        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-album">${song.album}</div>
          </div>
          ${badgeHtml}
        `;
        songListEl.appendChild(card);
      });
    }

    // 이름순 토글 클릭
    btnSortName.addEventListener("click", () => {
      btnSortYear.classList.remove("active");
      btnSortName.classList.add("active");

      if (currentSortMode === "name-asc") {
        currentSortMode = "name-desc";
        btnSortName.innerText = "이름순 ↓ (Z-A)";
      } else {
        currentSortMode = "name-asc";
        btnSortName.innerText = "이름순 ↑ (A-Z)";
      }
      renderList();
    });

    // 발매연도 토글 클릭
    btnSortYear.addEventListener("click", () => {
      btnSortName.classList.remove("active");
      btnSortYear.classList.add("active");

      if (currentSortMode === "year-asc") {
        currentSortMode = "year-desc";
        btnSortYear.innerText = "발매연도순 ↓ (최신순)";
      } else {
        currentSortMode = "year-asc";
        btnSortYear.innerText = "발매연도순 ↑ (과거순)";
      }
      renderList();
    });

    searchInput.addEventListener("input", renderList);

    renderList();
  </script>
</body>
</html>
