<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu Live Chant Guide</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --card-hover: #23232a;
      --accent-color: #ff4757;
      --text-main: #ffffff;
      --text-sub: #a0a0ab;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* 헤더 영역 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent-color);
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* 컨트롤러 영역 (검색창 + 정렬 버튼) */
    .controls-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-color);
    }

    /* 정렬 버튼 컨테이너 */
    .sort-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sort-btn {
      padding: 6px 14px;
      border-radius: 20px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sort-btn:hover {
      color: var(--text-main);
      border-color: #444455;
    }

    .sort-btn.active {
      background-color: rgba(255, 71, 87, 0.15);
      border-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: 600;
    }

    /* 곡 리스트 그리드 */
    .song-grid {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 곡 카드 */
    .song-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 22px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }

    .song-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .song-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .song-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .song-album {
      font-size: 0.85rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-chant {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-color);
      background-color: rgba(255, 71, 87, 0.12);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 71, 87, 0.3);
      white-space: nowrap;
    }

    /* 푸터 */
    footer {
      margin-top: auto;
      padding-top: 40px;
      color: var(--text-sub);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>King Gnu <span>Fan Chant Guide</span></h1>
    <p>킹누 라이브 떼창 가이드</p>
  </header>

  <div class="controls-wrapper">
    <!-- 곡 검색 기능 -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="곡 제목 또는 앨범 검색...">
    </div>

    <!-- 정렬 옵션 버튼 -->
    <div class="sort-container">
      <button class="sort-btn active" data-sort="default">기본순</button>
      <button class="sort-btn" data-sort="name">이름순 (A-Z)</button>
      <button class="sort-btn" data-sort="year-desc">최신순</button>
      <button class="sort-btn" data-sort="year-asc">발매연도순</button>
    </div>
  </div>

  <!-- 곡 목록 렌더링 영역 -->
  <div class="song-grid" id="songList"></div>

  <footer>
    <p>King Gnu Fan Chant Guide</p>
  </footer>

  <script>
    // 곡 데이터 목록 (발매연도 year 속성 포함)
    const songData = [
      {
        title: "SPECIALZ",
        album: "주술회전 2기 OP",
        year: 2023,
        url: "specialz.html"
      },
      {
        title: "Teenager Forever",
        album: "CEREMONY",
        year: 2020,
        url: "teenagerforever.html"
      },
      {
        title: "Flash!!!",
        album: "Sympa",
        year: 2019,
        url: "flash.html"
      },
      {
        title: "雨燦々",
        album: "THE GREATEST UNKNOWN",
        year: 2022,
        url: "amesansan.html"
      },
      {
        title: "Vinyl",
        album: "Tokyo Rendez-Vous",
        year: 2017,
        url: "vinyl.html"
      }
    ];

    let currentSort = "default";
    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const sortButtons = document.querySelectorAll(".sort-btn");

    function renderList() {
      const query = searchInput.value.toLowerCase().trim();

      // 1. 검색 필터링
      let filtered = songData.filter(song => 
        song.title.toLowerCase().includes(query) || 
        song.album.toLowerCase().includes(query)
      );

      // 2. 정렬 옵션 처리
      if (currentSort === "name") {
        filtered.sort((a, b) => a.title.localeCompare(b.title));
      } else if (currentSort === "year-desc") {
        filtered.sort((a, b) => b.year - a.year);
      } else if (currentSort === "year-asc") {
        filtered.sort((a, b) => a.year - b.year);
      }

      // 3. 렌더링
      songListEl.innerHTML = "";
      if (filtered.length === 0) {
        songListEl.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 40px 0;">검색 결과가 없습니다.</div>`;
        return;
      }

      filtered.forEach(song => {
        const card = document.createElement("a");
        card.href = song.url;
        card.className = "song-card";
        card.innerHTML = `
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-album">
              <span>${song.album}</span>
              <span>•</span>
              <span>${song.year}년</span>
            </div>
          </div>
          <span class="badge-chant">떼창가이드</span>
        `;
        songListEl.appendChild(card);
      });
    }

    // 정렬 버튼 클릭 이벤트 연결
    sortButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        sortButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSort = btn.dataset.sort;
        renderList();
      });
    });

    // 검색 입력 이벤트 연결
    searchInput.addEventListener("input", renderList);

    // 초기 화면 실행
    renderList();
  </script>
</body>
</html>
