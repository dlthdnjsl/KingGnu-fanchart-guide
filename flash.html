<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - Flash!!! (떼창 가이드)</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* 기본 아랫줄(발음/해석) 스타일 - 평소 일반 가사는 회색 & 작은 글씨 */
    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    /* 1. 일반 가사 재생 중(active) -> 윗줄 흰색 강조 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 2. 떼창 가사 평소 상태 -> 원문, 발음, 해석 전부 동일한 빨간색 통일 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 3. 떼창 가사 재생 중(active) -> 3줄 전부 선명한 네온 빨간색으로 통일 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <!-- 상단 뒤로가기 및 제목 -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 목록으로</a>
    <div class="page-title">Flash!!!</div>
    <div style="width: 70px;"></div>
  </div>

  <!-- 유튜브 동영상 영역 -->
  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <!-- 가사 스크롤 영역 -->
  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    const YOUTUBE_VIDEO_ID = 'j_NHrPC3ij8'; 

    // 가사 데이터 및 태그 구조 예시 (타임코드 기본 0.0 설정)
    const lyricsData = [
      { time: 0.0, text: "Ladies and gentleman, King Gnu", isChant: false },
      { time: 20.8, text: "It's flash!", isChant: true },
       { time: 24.0, text: "It's flash!", isChant: true },
       { time: 27.8, text: "It's, it's flash!", isChant: true },
       { time: 31.7, text: "It's flash!", isChant: true },
      { time: 35.8, text: "全ては冗談だって ホンモンかニセモンかなんて<br><span class='sub-lyric'>스베테와 죠단닷테 혼몬카 니세몬카 난테<br>모든 건 농담이야 진짜 가짜 따위는</span>", isChant: false },
      { time: 39.5, text: "くだらねえぜ真実なんて ただ下り坂を猛スピードで<br><span class='sub-lyric'>쿠다라네제 신지츠난테 타다 쿠다리자카오 모스피도데<br>진실 같은 건 시시해 그저 내리막길을 엄청난 스피드로</span>", isChant: false },
      { time: 43.0, text: "駆け抜けるんだ 振り払えんだ 思いのままに<br><span class='sub-lyric'>카케누케룬다 후리하라엔다 오모이노마마니<br>마음껏 달려가는 거야 뿌리치는 거야</span>", isChant: false },
      { time: 46.3, text: "(oh no)", isChant: true },
      { time: 47.5, text: "ブレーキは折れちまってんだ<br><span class='sub-lyric'>브레키와 오레치맛텐다<br>브레이크는 부러졌어</span>", isChant: false },
        { time: 49.5, text: "It's flash!", isChant: true },
       { time: 53.1, text: "It's flash!", isChant: true },
       { time: 56.5, text: "It's, it's flash!", isChant: true },
       { time: 60.0, text: "It's flash!", isChant: true },
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
