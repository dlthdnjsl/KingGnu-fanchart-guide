<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Gnu - Flash!!! (떼창 가이드)</title>
  <style>
    :root {
      --bg-color: #0f0f12;
      --card-bg: #18181c;
      --text-muted: #777785;
      --text-active: #ffffff;
      --chant-color: #ff4757;
      --border-color: #2a2a35;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* 상단 헤더 & 뒤로가기 버튼 */
    .top-bar {
      width: 100%;
      max-width: 560px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .back-btn {
      color: #a0a0ab;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: #fff;
      border-color: var(--chant-color);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    /* 유튜브 플레이어 박스 */
    .player-wrapper {
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      max-height: 220px;
      margin-bottom: 16px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    #player {
      width: 100%;
      height: 100%;
    }

    /* 가사 스크롤 영역 */
    .lyrics-wrapper {
      width: 100%;
      max-width: 560px;
      height: 52vh;
      min-height: 280px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .lyric-line {
      padding: 10px 12px;
      margin: 4px 0;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--text-muted);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    /* 기본 아랫줄(발음/해석) 스타일 - 평소 일반 가사는 회색 & 작은 글씨 */
    .sub-lyric {
      font-size: 0.8rem;
      color: #8a8a98;
      font-weight: 400;
      display: block;
      margin-top: 3px;
      transition: color 0.2s;
    }

    /* 1. 일반 가사 재생 중(active) -> 윗줄 흰색 강조 */
    .lyric-line.active {
      color: var(--text-active);
      font-weight: 700;
      font-size: 1.1rem;
      background-color: rgba(255, 255, 255, 0.08);
    }

    /* 2. 떼창 가사 평소 상태 -> 원문, 발음, 해석 전부 동일한 빨간색 통일 */
    .lyric-line.chant,
    .lyric-line.chant .sub-lyric {
      color: #ff6b81 !important;
    }

    /* 3. 떼창 가사 재생 중(active) -> 3줄 전부 선명한 네온 빨간색으로 통일 */
    .lyric-line.active.chant,
    .lyric-line.active.chant .sub-lyric {
      color: #ff4757 !important;
      text-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
    }
  </style>
</head>
<body>

  <!-- 상단 뒤로가기 및 제목 -->
  <div class="top-bar">
    <a href="index.html" class="back-btn">← 목록으로</a>
    <div class="page-title">Flash!!!</div>
    <div style="width: 70px;"></div>
  </div>

  <!-- 유튜브 동영상 영역 -->
  <div class="player-wrapper">
    <div id="player"></div>
  </div>

  <!-- 가사 스크롤 영역 -->
  <div class="lyrics-wrapper" id="lyricsContainer"></div>

  <script>
    const YOUTUBE_VIDEO_ID = 'j_NHrPC3ij8'; 

    // 가사 데이터 및 태그 구조 예시 (타임코드 기본 0.0 설정)
    const lyricsData = [
      { time: 0.0, text: "Ladies and gentleman, King Gnu", isChant: false },
      { time: 5.0, text: "🎵", isChant: false },
      { time: 20.0, text: "(Not a joke)", isChant: false },
      { time: 20.8, text: "It's flash!", isChant: true },
      { time: 24.0, text: "It's flash!", isChant: true },
      { time: 27.8, text: "It's, it's flash!", isChant: true },
      { time: 31.7, text: "It's flash!", isChant: true },
      { time: 35.8, text: "👏 全ては冗談だって ホンモンかニセモンかなんて<br><span class='sub-lyric'>스베테와 죠단닷테 혼몬카 니세몬카 난테<br>모든 건 농담이야 진짜 가짜 따위는</span>", isChant: false },
      { time: 39.0, text: "👏 くだらねえぜ真実なんて ただ下り坂を猛スピードで<br><span class='sub-lyric'>쿠다라네제 신지츠난테 타다 쿠다리자카오 모스피도데<br>진실 같은 건 시시해 그저 내리막길을 엄청난 스피드로</span>", isChant: false },
      { time: 43.3, text: "👏 駆け抜けるんだ 振り払えんだ 思いのままに<br><span class='sub-lyric'>카케누케룬다 후리하라엔다 오모이노마마니<br>마음껏 달려가는 거야 뿌리치는 거야</span>", isChant: false },
      { time: 46.3, text: "(oh no)", isChant: true },
      { time: 47.5, text: "ブレーキは折れちまってんだ<br><span class='sub-lyric'>브레키와 오레치맛텐다<br>브레이크는 부러졌어</span>", isChant: false },
      { time: 49.5, text: "It's flash!", isChant: true },
      { time: 53.1, text: "It's flash!", isChant: true },
      { time: 56.3, text: "It's, it's flash!", isChant: true },
      { time: 60.0, text: "It's flash!", isChant: true },
      { time: 64.0, text: "密かに期待しちゃいないかい?<br><span class='sub-lyric'>히소카니 키타이시챠이나이카이<br> 혹시 몰래 기대하고 있지 않아?</span>", isChant: false },
      { time: 66.0, text: "思い通りにいきやしないぜ?<br><span class='sub-lyric'>오모이도오리니 이키야시나이제<br>생각한대로 흘러가진 않지?</span>", isChant: false },
      { time: 68.0, text: "やるせないね それでも主役は誰だ? お前だろ<br><span class='sub-lyric'>야루세나이네 소레데모 슈야쿠와 다레다 오마에다로<br>막막하네 그래도 주인공은 누구야? 너잖아</span>", isChant: false },
      { time: 72.0, text: "輝けるんだ いつだって思いのままに<br><span class='sub-lyric'>카가야케룬다 이츠닷테 오모이노마마니<br>빛날 수 있어 언제라도 마음껏</span>", isChant: false },
      { time: 74.7, text: "(oh no, no, no, no, no)", isChant: true },
      { time: 78.5, text: "🎵", isChant: false },
      { time: 90.7, text: "(no, no, no, no)", isChant: true },
      { time: 92.7, text: "間違いだらけの人生が<br><span class='sub-lyric'>마치가이다라케노 진세이가<br>오답투성이인 인생이</span>", isChant: false },
      { time: 95.2, text: "光を見失わせる tonight<br><span class='sub-lyric'>히카리오 미우시나와세루 tonight<br>빛을 잃게 하는 tonight</span>", isChant: false },
      { time: 99.8, text: "一瞬でいい 今だけでいい<br><span class='sub-lyric'>잇슌데이이 이마다케데이이<br>한순간이라도 좋아 지금뿐이라도 좋아</span>", isChant: false },
      { time: 104.3, text: "逆らって<br><span class='sub-lyric'>사카랏테<br>거역해봐</span>", isChant: true },
      { time: 106.5, text: "全てを求めないで 時の流れを許して<br><span class='sub-lyric'>스베테오 모토메나이데 토키노 나가레오 유루시테<br>모든 걸 원하지 말고 시간의 흐름을 받아들여봐</span>", isChant: false },
      { time: 114.0, text: "この身を焦がしてでも<br><span class='sub-lyric'>코노미오 코가시테데모<br>이 한 몸 태운다해도</span>", isChant: false },
      { time: 118.5, text: "光放って<br><span class='sub-lyric'>히카리 하낫테<br>빛을 발해줘</span>", isChant: false },
      { time: 121.0, text: "It's flash!", isChant: true },
      { time: 122.5, text: "🎵", isChant: false },
      { time: 135.5, text: "It's flash!", isChant: true },
      { time: 136.2, text: "全ては冗談だって ホンモンかニセモンかなんて<br><span class='sub-lyric'>스베테와 죠단닷테 혼몬카 니세몬카 난테<br>모든 건 농담이야 진짜 가짜 따위는</span>", isChant: false },
      { time: 139.5, text: "くだらねえぜ真実なんて ただ下り坂を猛スピードで<br><span class='sub-lyric'>쿠다라네제 신지츠난테 타다 쿠다리자카오 모스피도데<br>진실 같은 건 시시해 그저 내리막길을 엄청난 스피드로</span>", isChant: false },
      { time: 143.8, text: "駆け抜けるんだ 振り払えんだ 思いのままに<br><span class='sub-lyric'>카케누케룬다 후리하라엔다 오모이노마마니<br>마음껏 달려가는 거야 뿌리치는 거야</span>", isChant: false },
      { time: 146.7, text: "(oh no, no, no, no, no)", isChant: true },
      { time: 150.5, text: "誰もが矛盾を抱えてんだ 翻弄され踊り踊らされ<br><span class='sub-lyric'>다레모가 무쥰오 카카에텐다 혼로사레 오도리 오도라사레<br>모두가 모순을 안고 살아가 휘둘리고 춤추고 놀아나고</span>", isChant: false },
      { time: 154.0, text: "それでも何度でも立ち上がれ<br><span class='sub-lyric'>소레데모 난도데모 타치아가레<br>그래도 몇번이라도 다시 일어나</span>", isChant: false },
      { time: 155.7, text: "いつだって主役はお前だろ<br><span class='sub-lyric'>이츠닷테 슈야쿠와 오마에다로<br>언제라도 주인공은 너잖아</span>", isChant: false },
      { time: 157.8, text: "輝けるんだ 変わらない思いのままで<br><span class='sub-lyric'>카가야케룬다 카와라나이 오모이노마마데<br>빛날 수 있어 변하지 않는 마음을 갖고</span>", isChant: false },
      { time: 160.8, text: "(oh no)", isChant: true },
      { time: 163.0, text: "歯止めは最早効かねえんだ<br><span class='sub-lyric'>하도메와 모하야 키카넨다<br>브레이크는 이미 말을 듣지 않아</span>", isChant: false }
    ];

    let player;
    let timerInterval = null;
    let currentIndex = -1;

    const container = document.getElementById('lyricsContainer');
    lyricsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = `lyric-line ${item.isChant ? 'chant' : ''}`;
      div.innerHTML = item.text;
      div.id = `lyric-${index}`;
      
      div.addEventListener('click', () => {
        if (player && player.seekTo) {
          player.seekTo(item.time, true);
          player.playVideo();
        }
      });
      
      container.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: YOUTUBE_VIDEO_ID,
        playerVars: { 'rel': 0, 'modestbranding': 1, 'playsinline': 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        if (!timerInterval) {
          timerInterval = setInterval(updateLyrics, 100);
        }
      } else {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function updateLyrics() {
      if (!player || !player.getCurrentTime) return;
      const currentTime = player.getCurrentTime();

      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (currentTime >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentIndex) {
        if (currentIndex !== -1) {
          const prevEl = document.getElementById(`lyric-${currentIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const currentEl = document.getElementById(`lyric-${activeIndex}`);
          if (currentEl) {
            currentEl.classList.add('active');
            currentEl.scrollIntoView({
              behavior: 'smooth',
              block: 'center'
            });
          }
        }

        currentIndex = activeIndex;
      }
    }
  </script>
</body>
</html>
